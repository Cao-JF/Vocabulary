<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>背單字</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --border:#dfe3ea;
  --text:#1b1f27; --muted:#6b7280; --accent:#3b6ef5; --accent-fg:#ffffff;
  --ok:#17936a; --warn:#b3760a; --bad:#d23b3b;
  --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.08),0 6px 20px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218; --surface:#171b23; --surface-2:#20252f; --border:#2c333f;
    --text:#e8eaee; --muted:#9aa3b2; --accent:#5b86ff; --accent-fg:#0b0e14;
    --ok:#3ecf9a; --warn:#e0a83a; --bad:#ff6b6b;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b23; --surface-2:#20252f; --border:#2c333f;
  --text:#e8eaee; --muted:#9aa3b2; --accent:#5b86ff; --accent-fg:#0b0e14;
  --ok:#3ecf9a; --warn:#e0a83a; --bad:#ff6b6b;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* ---------- layout ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
header.topbar{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:10px 16px calc(10px + env(safe-area-inset-top,0)) 16px;
  padding-top:calc(10px + env(safe-area-inset-top,0));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.brand{font-weight:700;font-size:17px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0}
.topbar .spacer{flex:1}
main{flex:1;padding:16px;padding-bottom:calc(80px + env(safe-area-inset-bottom,0));max-width:1040px;width:100%;margin:0 auto}
nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0);
}
nav.tabbar button{
  flex:1;background:none;border:0;padding:8px 2px 10px;min-height:56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:11px;
}
nav.tabbar button .ic{font-size:19px;line-height:1}
nav.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
@media (min-width:860px){
  #app{flex-direction:row}
  nav.tabbar{
    position:sticky;top:0;bottom:auto;height:100vh;width:190px;flex-direction:column;
    border-top:0;border-right:1px solid var(--border);padding:16px 10px;gap:4px;align-self:flex-start;
  }
  nav.tabbar button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;
    padding:0 14px;min-height:46px;border-radius:10px;font-size:14px}
  nav.tabbar button[aria-current="page"]{background:var(--surface-2)}
  .col{flex:1;min-width:0;display:flex;flex-direction:column}
  main{padding:24px;padding-bottom:40px}
}
.col{display:flex;flex-direction:column;min-width:0;flex:1}

/* ---------- atoms ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
h1{font-size:21px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600}
p.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.btn{
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;min-height:42px;font-size:14px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
input[type=text],input[type=password],input[type=number],select,textarea{
  background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;min-height:42px;width:100%;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
label.field{display:block;margin-bottom:12px}
label.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:12px;
}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pos{color:var(--warn);font-style:italic;font-size:13px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .big{font-size:36px;margin-bottom:8px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);transition:width .25s}
.speak{
  background:none;border:0;padding:6px;font-size:18px;line-height:1;border-radius:8px;color:var(--muted);
  min-width:34px;min-height:34px;
}
.speak:hover{color:var(--accent);background:var(--surface-2)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0));
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;
  z-index:100;box-shadow:var(--shadow);max-width:90vw;text-align:center;
}
@media (min-width:860px){.toast{bottom:26px}}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
td input[type=text]{min-height:34px;padding:5px 8px;border-radius:7px;font-size:13px}
tr.dup{opacity:.5}
.st{font-size:12px;white-space:nowrap}
.st.new{color:var(--ok)} .st.dup{color:var(--muted)} .st.load{color:var(--accent)} .st.err{color:var(--bad)}

/* ---------- word list ---------- */
.wlist{list-style:none;margin:0;padding:0}
.wlist li{
  display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);
}
.wlist li:last-child{border-bottom:0}
.wmain{flex:1;min-width:0}
.wterm{font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.wsub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boxdot{width:7px;height:7px;border-radius:99px;background:var(--border);flex:none}
.boxdot.b2{background:var(--warn)} .boxdot.b3{background:var(--warn)}
.boxdot.b4{background:var(--ok)} .boxdot.b5{background:var(--ok)}

/* ---------- flashcard ---------- */
.flash{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);
  min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:28px 20px;text-align:center;user-select:none;cursor:pointer;
}
.flash .term{font-size:34px;font-weight:700;word-break:break-word}
.flash .zh{font-size:24px;font-weight:600}
.flash .ph{color:var(--muted);font-size:15px;font-family:ui-monospace,Menlo,monospace}
.flash .ex{color:var(--muted);font-size:14px;font-style:italic;max-width:46ch}

/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qhead .bar{flex:1}
.qprompt{font-size:27px;font-weight:700;text-align:center;margin:18px 0;word-break:break-word}
.qprompt.small{font-size:22px}
.opts{display:grid;gap:10px}
@media (min-width:600px){.opts{grid-template-columns:1fr 1fr}}
.opt{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px;min-height:54px;text-align:left;font-size:15px;width:100%;
}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{font-size:14px;padding:12px;min-height:50px;text-align:center}
.match .opt.sel{border-color:var(--accent);background:var(--surface-2)}
.match .opt.done{opacity:.25;pointer-events:none;border-style:dashed}
.spellbox{font-size:20px;text-align:center;letter-spacing:1px;font-family:ui-monospace,Menlo,monospace}
/* 拼字框用 password 型別讓手機鍵盤不出選字提示；
   框裡的圓點與游標設成透明，再把實際輸入的字母疊在上面顯示 */
.spellwrap{position:relative;margin-top:14px}
.spellwrap .spellbox{color:transparent;caret-color:transparent}
.spellwrap .spellbox::placeholder{color:var(--muted)}
.spellshow{
  position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;
  font-size:20px;letter-spacing:1px;font-family:ui-monospace,Menlo,monospace;white-space:pre;overflow:hidden;
}
.spellshow .caret{display:none;width:2px;height:1.2em;background:var(--accent);margin-left:1px;animation:blink 1s steps(1) infinite}
.spellbox:focus + .spellshow .caret{display:inline-block}
.spellbox:placeholder-shown + .spellshow{justify-content:flex-start;padding-left:12px}
.spellbox:placeholder-shown + .spellshow .caret{display:none}
@keyframes blink{50%{opacity:0}}
.hintword{text-align:center;font-family:ui-monospace,Menlo,monospace;letter-spacing:5px;font-size:20px;color:var(--muted)}
.fb{text-align:center;font-weight:600;min-height:26px;margin-top:10px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.score{font-size:46px;font-weight:700;text-align:center}
.picklist{max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
.picklist label{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.picklist label:last-child{border-bottom:0}
.picklist input{width:auto;min-height:0;flex:none}
.flash .zh .pos{font-size:15px}
.flash .zh + .zh{font-size:19px;font-weight:500}
.wsub .sense + .sense{margin-left:10px}
.picklist .pz{color:var(--muted);font-size:13px;margin-left:auto;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}

/* ---------- 專心看 ---------- */
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rlist li{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;display:flex;gap:10px;align-items:flex-start;
}
.rlist .rmain{flex:1;min-width:0}
.rlist .rterm{font-size:22px;font-weight:700;word-break:break-word;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rlist .rph{color:var(--muted);font-size:14px;font-family:ui-monospace,Menlo,monospace;font-weight:400}
.rlist .rzh{font-size:17px;margin-top:4px}
.rlist .rex{color:var(--muted);font-size:14px;font-style:italic;margin-top:6px}
.rlist .cover{
  display:inline-block;min-width:6em;border-radius:6px;background:var(--surface-2);
  color:transparent;user-select:none;cursor:pointer;
}
.rlist .cover *{visibility:hidden}
.rnum{color:var(--muted);font-size:12px;min-width:2.2em;padding-top:8px;text-align:right}
</style>
</head>
<body>
<div id="app">
  <nav class="tabbar" id="tabbar"></nav>
  <div class="col">
    <header class="topbar">
      <div class="brand">背單字<small id="brandSub">Vocabulary Trainer</small></div>
      <div class="spacer"></div>
      <select id="focusSel" style="width:auto;min-width:130px;max-width:46vw"></select>
      <button class="btn sm ghost" id="soundBtn" title="自動發音開關">🔊</button>
      <button class="btn sm ghost" id="themeBtn" title="切換主題">◐</button>
    </header>
    <main id="view"></main>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   Store — localStorage 資料層
   ===================================================================== */
const KEY = "vocab.v1";
const Store = {
  data: null,
  defaults(){
    return {
      words:{}, groups:[], cache:{},
      settings:{ llmProvider:"none", apiKey:"", voiceURI:"", rate:0.95, autoSpeak:true, theme:"auto", studyDir:"en2zh" },
      focusGroup:"all"
    };
  },
  load(){
    let d = null;
    try{ const raw = localStorage.getItem(KEY); if(raw) d = JSON.parse(raw); }catch(e){ console.warn("load failed",e); }
    this.data = Object.assign(this.defaults(), d||{});
    this.data.settings = Object.assign(this.defaults().settings, this.data.settings||{});
    if(this.migrate()) this.save();
    return this.data;
  },
  /* 舊資料只有單一 pos/zh：把擠在中文裡的「（名詞）…」拆成多組詞性 */
  migrate(){
    let n = 0;
    Object.values(this.data.words).forEach(w=>{
      if(!Array.isArray(w.senses)){ setSenses(w, parseSenses(w.zh, w.pos)); n++; }
    });
    return n;
  },
  save(){
    try{ localStorage.setItem(KEY, JSON.stringify(this.data)); }
    catch(e){ toast("儲存失敗：瀏覽器空間可能已滿"); console.warn(e); }
  },
  uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); },

  norm(t){ return (t||"").trim().toLowerCase(); },
  findByTerm(term){
    const n = this.norm(term);
    return Object.values(this.data.words).find(w=>this.norm(w.term)===n) || null;
  },
  addWord(o){
    const w = {
      id:this.uid(), term:(o.term||"").trim(), pos:o.pos||"", zh:o.zh||"",
      phonetic:o.phonetic||"", example:o.example||"", createdAt:Date.now(),
      stats:{ seen:0, correct:0, wrong:0, lastSeen:0, box:1 }
    };
    setSenses(w, o.senses || parseSenses(o.zh, o.pos));
    this.data.words[w.id]=w; return w;
  },
  /* 把 dup 併進 keep：詞性與中文取聯集、補空白欄位、單字組與自選清單改指向 keep */
  mergeWords(keepId, dupId){
    const k = this.data.words[keepId], d = this.data.words[dupId];
    if(!k || !d || k===d) return;
    const ks = wordSenses(k).map(x=>({...x}));
    wordSenses(d).forEach(x=>{
      if(!x.zh && !x.pos) return;
      const t = ks.find(y=>y.pos===x.pos);
      if(!t){ ks.push({...x}); return; }
      const have = new Set(t.zh.split(/[；;]/).map(z=>z.trim()));
      const add = x.zh.split(/[；;]/).map(z=>z.trim()).filter(z=>z && !have.has(z));
      if(add.length) t.zh = [t.zh, ...add].filter(Boolean).join("；");
    });
    setSenses(k, ks);
    if(!k.phonetic) k.phonetic = d.phonetic||"";
    if(!k.example)  k.example  = d.example||"";
    if((d.stats?.seen||0) > (k.stats?.seen||0)) k.stats = d.stats;
    const swap = arr=>[...new Set(arr.map(id=>id===dupId ? keepId : id))];
    this.data.groups.forEach(g=>{ g.wordIds = swap(g.wordIds); });
    Object.values(this.data.quizPicks||{}).forEach(arr=>{ const u = swap(arr); arr.length = 0; arr.push(...u); });
    delete this.data.words[dupId];
  },
  deleteWords(ids){
    ids.forEach(id=>{ delete this.data.words[id]; });
    this.data.groups.forEach(g=>{ g.wordIds = g.wordIds.filter(id=>!ids.includes(id)); });
    this.save();
  },
  /* 把熟練度打回原點：盒號回 1，答對/答錯紀錄清空 */
  resetStats(ids){
    let n=0;
    ids.forEach(id=>{
      const w=this.data.words[id]; if(!w) return;
      w.stats = { seen:0, correct:0, wrong:0, lastSeen:0, box:1 };
      n++;
    });
    this.save(); return n;
  },
  /* 手動標記：熟 = 直接進第 5 盒，不熟 = 回第 1 盒 */
  setBox(ids, box){
    ids.forEach(id=>{
      const w=this.data.words[id]; if(!w) return;
      if(!w.stats) w.stats={seen:0,correct:0,wrong:0,lastSeen:0,box:1};
      w.stats.box = Math.max(1, Math.min(5, box));
      w.stats.lastSeen = Date.now();
    });
    this.save();
  },
  addGroup(name){
    const g = { id:this.uid(), name:name.trim()||"未命名", wordIds:[], createdAt:Date.now() };
    this.data.groups.push(g); this.save(); return g;
  },
  group(id){ return this.data.groups.find(g=>g.id===id)||null; },
  addToGroup(gid, ids){
    const g=this.group(gid); if(!g) return 0;
    let n=0; ids.forEach(id=>{ if(!g.wordIds.includes(id)){ g.wordIds.push(id); n++; } });
    this.save(); return n;
  },
  removeFromGroup(gid, ids){
    const g=this.group(gid); if(!g) return;
    g.wordIds = g.wordIds.filter(id=>!ids.includes(id)); this.save();
  },
  groupWords(gid){
    if(gid==="all"||!gid) return Object.values(this.data.words);
    const g=this.group(gid); if(!g) return [];
    return g.wordIds.map(id=>this.data.words[id]).filter(Boolean);
  },
  focusWords(){ return this.groupWords(this.data.focusGroup); },
  groupsOf(wid){ return this.data.groups.filter(g=>g.wordIds.includes(wid)); },
  mastery(words){
    if(!words.length) return 0;
    return Math.round(words.filter(w=>(w.stats?.box||1)>=4).length / words.length * 100);
  },
  grade(w, ok){
    const s = w.stats || (w.stats={seen:0,correct:0,wrong:0,lastSeen:0,box:1});
    s.seen++; s.lastSeen=Date.now();
    if(ok){ s.correct++; s.box=Math.min(5,(s.box||1)+1); }
    else  { s.wrong++;   s.box=1; }
  }
};

/* =====================================================================
   Speech — Web Speech API 發音
   ===================================================================== */
const Speech = {
  voices:[], warmed:false,
  init(){
    const load = ()=>{
      this.voices = (window.speechSynthesis? speechSynthesis.getVoices():[])
        .filter(v=>/^en/i.test(v.lang));
    };
    if(!window.speechSynthesis) return;
    load();
    speechSynthesis.onvoiceschanged = ()=>{ load(); };
  },
  available(){ return !!window.speechSynthesis; },
  pick(){
    const uri = Store.data.settings.voiceURI;
    return this.voices.find(v=>v.voiceURI===uri)
        || this.voices.find(v=>/en[-_]US/i.test(v.lang))
        || this.voices.find(v=>/en[-_]GB/i.test(v.lang))
        || this.voices[0] || null;
  },
  /* iOS Safari 需要使用者手勢後才肯發聲，第一次互動先暖機 */
  warm(){
    if(this.warmed || !window.speechSynthesis) return;
    this.warmed = true;
    try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){}
  },
  say(text){
    if(!text || !window.speechSynthesis) return;
    this.warm();
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = this.pick(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
      u.rate = Number(Store.data.settings.rate)||0.95;
      speechSynthesis.speak(u);
    }catch(e){ console.warn("speak failed",e); }
  }
};

/* =====================================================================
   Lookup — 自動查詞性 / 中文 / 音標
   ===================================================================== */
const POS_ZH = {
  noun:"n.", verb:"v.", adjective:"adj.", adverb:"adv.", pronoun:"pron.",
  preposition:"prep.", conjunction:"conj.", interjection:"int.",
  determiner:"det.", numeral:"num.", article:"art.", exclamation:"int."
};
const Lookup = {
  cacheGet(term){ return Store.data.cache[Store.norm(term)] || null; },
  cacheSet(term, v){ Store.data.cache[Store.norm(term)] = v; },

  usingLLM(){
    const s = Store.data.settings;
    return s.llmProvider !== "none" && !!s.apiKey;
  },

  /* ---- 免費路徑：dictionaryapi.dev + MyMemory ---- */
  /* 這兩個免費服務偶爾會回 5xx / 429，退避重試兩次 */
  async retry(fn, tries){
    let last;
    for(let i=0;i<(tries||3);i++){
      try{ return await fn(); }
      catch(e){
        last = e;
        if(/(4(?:04|00))|empty|no zh/i.test(String(e.message))) throw e;  /* 真的查無此字就別重試 */
        await new Promise(r=>setTimeout(r, 400*(i+1)+Math.random()*300));
      }
    }
    throw last;
  },
  /* 免費服務偶爾會吊著不回應，一律加 8 秒逾時 */
  async get(url){
    const c = new AbortController();
    const t = setTimeout(()=>c.abort(), 8000);
    try{ return await fetch(url, { signal:c.signal }); }
    catch(e){ throw new Error(e.name==="AbortError" ? "逾時" : String(e.message||e)); }
    finally{ clearTimeout(t); }
  },
  /* dictionaryapi.dev 整站掛掉時別再一直重打，連錯 4 次就這輪停用改走 Wiktionary */
  dictDown:0,
  async dict(term){
    if(this.dictDown >= 4) return await this.wiktionary(term);
    try{
      const v = await this.retry(()=>this.dictApi(term), 2);
      this.dictDown = 0;
      return v;
    }catch(e){
      if(!/empty|404/i.test(String(e.message))) this.dictDown++;
      return await this.wiktionary(term);
    }
  },
  /* 備援詞性來源：Wiktionary（有 CORS，但沒有音標） */
  async wiktionary(term){
    const r = await this.get("https://en.wiktionary.org/api/rest_v1/page/definition/"+encodeURIComponent(term.replace(/ /g,"_")));
    if(!r.ok) throw new Error("wikt "+r.status);
    const j = await r.json();
    const e = (j.en||[])[0];
    if(!e) throw new Error("wikt empty");
    const d = (e.definitions||[])[0]||{};
    const strip = h=>String(h||"").replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim();
    return {
      pos: POS_ZH[String(e.partOfSpeech||"").toLowerCase()] || e.partOfSpeech || "",
      phonetic: "",
      example: strip((d.examples||[])[0]||""),
      def: strip(d.definition)
    };
  },
  async dictApi(term){
    const r = await this.get("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(term));
    if(!r.ok) throw new Error("dict "+r.status);
    const j = await r.json();
    const e = Array.isArray(j) ? j[0] : null;
    if(!e) throw new Error("dict empty");
    const m = (e.meanings||[])[0] || {};
    const d = (m.definitions||[])[0] || {};
    let ph = e.phonetic || "";
    if(!ph && Array.isArray(e.phonetics)) ph = (e.phonetics.find(p=>p.text)||{}).text || "";
    return {
      pos: POS_ZH[m.partOfSpeech] || m.partOfSpeech || "",
      phonetic: ph,
      example: d.example || "",
      def: d.definition || ""
    };
  },
  async translate(term){
    const url = "https://api.mymemory.translated.net/get?q="+encodeURIComponent(term)+"&langpair=en|zh-TW";
    const r = await this.get(url);
    if(!r.ok) throw new Error("mm "+r.status);
    const j = await r.json();
    const t = j && j.responseData && j.responseData.translatedText;
    if(!t) throw new Error("mm empty");
    /* MyMemory 查不到時會原樣回傳英文或配額訊息 */
    if(/MYMEMORY WARNING|QUOTA/i.test(t)) throw new Error("quota");
    if(Store.norm(t)===Store.norm(term)) throw new Error("no zh");
    return t.trim();
  },
  async free(term){
    const out = { pos:"", zh:"", phonetic:"", example:"" };
    const [d, t] = await Promise.allSettled([
      this.dict(term),
      this.retry(()=>this.translate(term))
    ]);
    if(d.status==="fulfilled"){ out.pos=d.value.pos; out.phonetic=d.value.phonetic; out.example=d.value.example; }
    if(t.status==="fulfilled") out.zh = t.value;
    else if(d.status==="fulfilled" && d.value.def) out.zh = "";   /* 留空讓使用者補 */
    if(!out.pos && !out.zh) throw new Error("查無資料");
    return out;
  },

  /* ---- LLM 路徑：一次一批 ---- */
  prompt(terms){
    return "You are an English-Chinese dictionary. For each English word or phrase below, "+
      "return its part of speech, Traditional Chinese meaning, IPA phonetic, and one short example sentence.\n"+
      "Reply with ONLY a JSON array, no markdown fence, no commentary. Each element:\n"+
      '{"term":"","pos":"","zh":"","phonetic":"","example":""}\n'+
      'pos uses short forms: n. / v. / adj. / adv. / prep. / conj. / pron. / int.\n'+
      'zh is Traditional Chinese (台灣用語), multiple senses separated by "；", at most 3 senses.\n'+
      'If the word is also commonly used as another part of speech, add it to zh prefixed with that part of speech, '+
      'e.g. for "executive": pos "adj.", zh "主管的、行政的；n. 主管、經理".\n'+
      "phonetic includes the slashes, e.g. /ˈæp.əl/.\n"+
      "Keep term exactly as given.\n\nWords:\n" + terms.join("\n");
  },
  parseJSON(text){
    let t = String(text||"").trim();
    t = t.replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");
    const s = t.indexOf("["), e = t.lastIndexOf("]");
    if(s>=0 && e>s) t = t.slice(s, e+1);
    return JSON.parse(t);
  },
  async llmBatch(terms){
    const s = Store.data.settings;
    if(s.llmProvider==="anthropic"){
      const r = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST", signal: AbortSignal.timeout(90000),
        headers:{
          "content-type":"application/json",
          "x-api-key": s.apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body: JSON.stringify({
          model:"claude-sonnet-5", max_tokens:8000,
          messages:[{role:"user",content:this.prompt(terms)}]
        })
      });
      if(!r.ok) throw new Error("Anthropic "+r.status+" "+(await r.text()).slice(0,180));
      const j = await r.json();
      const txt = (j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
      return this.parseJSON(txt);
    }
    if(s.llmProvider==="gemini"){
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+encodeURIComponent(s.apiKey),{
        method:"POST", headers:{"content-type":"application/json"}, signal: AbortSignal.timeout(90000),
        body: JSON.stringify({ contents:[{parts:[{text:this.prompt(terms)}]}] })
      });
      if(!r.ok) throw new Error("Gemini "+r.status+" "+(await r.text()).slice(0,180));
      const j = await r.json();
      const txt = (((j.candidates||[])[0]||{}).content||{}).parts?.map(p=>p.text).join("")||"";
      return this.parseJSON(txt);
    }
    throw new Error("no provider");
  },

  /* ---- 對外：批次解析 rows（就地寫回 row），每筆更新呼叫 onTick ---- */
  async run(rows, onTick){
    this.dictDown = 0;
    const todo = rows.filter(r=>r.need && r.status!=="dup");
    todo.forEach(r=>{ r.status="load"; });
    onTick && onTick();

    /* 先吃快取 */
    const rest = [];
    for(const r of todo){
      const c = this.cacheGet(r.term);
      if(c){ this.apply(r,c); r.status="new"; }
      else rest.push(r);
    }
    onTick && onTick();
    if(!rest.length) return;

    if(this.usingLLM()){
      const SIZE = 40;
      for(let i=0;i<rest.length;i+=SIZE){
        const chunk = rest.slice(i,i+SIZE);
        try{
          const arr = await this.llmBatch(chunk.map(r=>r.term));
          const map = {};
          (arr||[]).forEach(o=>{ if(o&&o.term) map[Store.norm(o.term)] = o; });
          chunk.forEach(r=>{
            const o = map[Store.norm(r.term)];
            if(o){ this.apply(r,o); this.cacheSet(r.term,{pos:o.pos||"",zh:o.zh||"",phonetic:o.phonetic||"",example:o.example||""}); r.status="new"; }
            else { r.status="err"; r.error="LLM 未回傳此字"; }
          });
        }catch(e){
          chunk.forEach(r=>{ r.status="err"; r.error=String(e.message||e); });
        }
        onTick && onTick();
      }
      Store.save();
      return;
    }

    /* 免費 API：併發 3 */
    let idx = 0;
    const worker = async ()=>{
      while(idx < rest.length){
        const r = rest[idx++];
        try{
          const o = await this.free(r.term);
          this.apply(r,o); this.cacheSet(r.term,o); r.status="new";
        }catch(e){
          r.status="err"; r.error = String(e.message||e);
        }
        onTick && onTick();
      }
    };
    await Promise.all([worker(),worker(),worker()]);
    Store.save();
  },
  apply(row, o){
    if(!row.zh && o.zh) row.zh = o.zh;
    if(!row.pos && o.pos) row.pos = o.pos;
    if(!row.phonetic && o.phonetic) row.phonetic = o.phonetic;
    if(!row.example && o.example) row.example = o.example;
  }
};

/* =====================================================================
   詞性／多義：每個單字可以有多組 {pos, zh}
   w.senses 是正本；w.pos（第一組詞性）與 w.zh（全部中文用「；」串起來）
   只是給搜尋、判斷「有沒有中文」用的摘要，一律透過 setSenses 更新。
   ===================================================================== */
const POS_CN = { "名詞":"n.", "動詞":"v.", "及物動詞":"v.", "不及物動詞":"v.", "形容詞":"adj.", "副詞":"adv.",
  "介系詞":"prep.", "介詞":"prep.", "連接詞":"conj.", "連詞":"conj.", "代名詞":"pron.", "感嘆詞":"int.",
  "片語":"phr.", "動詞片語":"phr." };
const POS_ABBR_RE = /^(n|v|vt|vi|adj|adv|prep|conj|pron|int|phr|aux|det|num|art)\.?$/i;
function normPos(p){
  p = String(p||"").trim();
  if(!p) return "";
  if(POS_CN[p]) return POS_CN[p];
  if(POS_ZH[p.toLowerCase()]) return POS_ZH[p.toLowerCase()];
  if(POS_ABBR_RE.test(p)) return p.toLowerCase().replace(/\.?$/, ".");
  return p;
}
function isPos(p){ p = String(p||"").trim(); return !!(POS_CN[p] || POS_ZH[p.toLowerCase()] || POS_ABBR_RE.test(p)); }
/* 把「主管的、行政的；（名詞）主管、經理」或「adj. 主管的；n. 主管」拆成多組。
   「（刊物）期、號」這種不是詞性的括號會留在原本那組裡。 */
function parseSenses(zh, pos){
  let cur = { pos:normPos(pos), zh:[] };
  const out = [cur];
  String(zh||"").split(/[；;]/).map(x=>x.trim()).filter(Boolean).forEach(seg=>{
    let p = "", rest = seg, m;
    if((m = seg.match(/^[（(]\s*([^）)]+?)\s*[）)]\s*(.*)$/)) && isPos(m[1])){ p = normPos(m[1]); rest = m[2]; }
    else if((m = seg.match(/^(n|v|vt|vi|adj|adv|prep|conj|pron|int|phr)\.\s*(.+)$/i))){ p = normPos(m[1]); rest = m[2]; }
    if(p && p!==cur.pos){
      const same = out.find(x=>x.pos===p);
      if(same) cur = same;
      else if(!cur.zh.length) cur.pos = p;
      else { cur = { pos:p, zh:[] }; out.push(cur); }
    }
    if(rest) cur.zh.push(rest);
  });
  const res = out.map(x=>({ pos:x.pos, zh:x.zh.join("；") }));
  const withZh = res.filter(x=>x.zh);
  return withZh.length ? withZh : [res[0]];
}
function wordSenses(w){
  return (w.senses && w.senses.length) ? w.senses : [{ pos:w.pos||"", zh:w.zh||"" }];
}
function setSenses(w, arr){
  arr = (arr||[]).map(x=>({ pos:normPos(x.pos), zh:String(x.zh||"").trim() })).filter(x=>x.pos || x.zh);
  if(!arr.length) arr = [{ pos:"", zh:"" }];
  w.senses = arr;
  w.pos = arr[0].pos;
  w.zh = arr.map(x=>x.zh).filter(Boolean).join("；");
}
/* 測驗每題隨機考其中一組有中文的意思 */
function pickSense(w){
  const ss = wordSenses(w).filter(x=>x.zh);
  return ss.length ? ss[Math.floor(Math.random()*ss.length)] : { pos:w.pos||"", zh:w.zh||"" };
}
/* 把中文拆成一個個意思（去掉括號說明），用來判斷兩個字的意思有沒有撞在一起 */
function zhItems(zh){
  return String(zh||"").replace(/[（(][^）)]*[）)]/g, "").split(/[、；;,，\/]/).map(x=>x.trim()).filter(Boolean);
}
function senseHTML(x){ return (x.pos ? '<span class="pos">'+esc(x.pos)+'</span> ' : '') + esc(x.zh); }
function sensesText(w){ return wordSenses(w).map(x=>(x.pos ? x.pos+" " : "")+x.zh).join("　"); }

/* 清單編號與項目符號：「1. apple」「(2) apple」「- apple」 */
const NUM_RE = /^\s*(?:[-•*·‧]\s*|\(?\d{1,3}\s*[.)、．:：]\s*)/;
function stripNum(t){ return String(t||"").replace(NUM_RE, "").trim(); }

/* =====================================================================
   小工具
   ===================================================================== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function el(html){
  /* 用 <template> 解析：<tr>/<td> 這類表格片段才不會被瀏覽器丟掉。
     樣板有多個根元素時回傳 fragment，呼叫端 appendChild 後可從父層 querySelector。 */
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  const c = t.content;
  return c.children.length === 1 ? c.firstElementChild : c;
}
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
let toastTimer=null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(n=>n.remove());
  const t = el('<div class="toast">'+esc(msg)+'</div>');
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 2600);
}
/* 自動發音（翻卡、出題提示、答題回饋）。手動按喇叭鈕與聽力題的題目不走這裡，
   因為那是使用者主動要求、或題目本身就是聲音。 */
function autoSay(term){ if(Store.data.settings.autoSpeak) Speech.say(term); }
function speakBtn(term){
  return Speech.available() ? '<button class="speak" data-speak="'+esc(term)+'" title="發音">🔊</button>' : "";
}
function download(name, text){
  const b = new Blob([text],{type:"application/json"});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a"); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u), 1000);
}

/* =====================================================================
   匯入文字解析
   ===================================================================== */
function parseImport(text){
  const rows = [];
  const seen = new Set();
  text.split(/\r?\n/).forEach(line=>{
    const raw = stripNum(line);
    if(!raw) return;
    let parts;
    if(raw.includes("|")) parts = raw.split("|");
    else if(raw.includes("\t")) parts = raw.split("\t");
    else if(/[,;，；]/.test(raw)) parts = raw.split(/[,;，；]/);
    else parts = [raw];
    parts = parts.map(p=>p.trim()).filter((p,i)=>i===0||p!=="");
    const term = parts[0];
    if(!term) return;
    const key = Store.norm(term);
    if(seen.has(key)) return;
    seen.add(key);

    let pos="", zh="";
    /* 第二欄若長得像詞性就當詞性，否則當中文。
       中文欄可以寫多組詞性：「adj. 主管的；n. 主管」，存檔時再拆開 */
    if(parts.length>=2){
      if(isPos(parts[1])){ pos=parts[1]; zh=parts.slice(2).join("；"); }
      else zh=parts.slice(1).join("；");
    }
    const exist = Store.findByTerm(term);
    rows.push({
      term, pos, zh, phonetic:"", example:"",
      need: !zh || !pos,
      pick: !exist,
      status: exist ? "dup" : "new",
      existId: exist ? exist.id : null,
      error:""
    });
  });
  return rows;
}

        </label>
        <input type="text" id="gname" placeholder="新組名稱" style="flex:1;min-width:160px;display:none">
      </div>
      <div class="row end" style="margin-top:6px">
        ${nErr?'<button class="btn sm" id="retryBtn">重試失敗項</button>':''}
        <button class="btn primary" id="doImport">確認匯入 ${nNew} 筆</button>
      </div>
    </div>`);
    wrap.appendChild(card);

    const tb = card.querySelector("#tb");
    importRows.forEach((r,i)=>{
      const stTxt = { new:"新增", dup:"已存在", load:"查詢中…", err:"失敗" }[r.status] || r.status;
      const tr = el(`<tr${r.status==="dup"?' class="dup"':''}>
        <td><input type="checkbox" data-i="${i}" class="pick"${r.pick?" checked":""}${r.status==="dup"?" disabled":""}></td>
        <td><input type="text" data-f="term" data-i="${i}" value="${esc(r.term)}"></td>
        <td><input type="text" data-f="pos" data-i="${i}" value="${esc(r.pos)}"></td>
        <td><input type="text" data-f="zh" data-i="${i}" value="${esc(r.zh)}" placeholder="${r.status==='err'?esc(r.error||'查詢失敗，請手動填'):''}"></td>
        <td class="st ${r.status}">${stTxt}</td>
        <td>${speakBtn(r.term)}</td>
      </tr>`);
      tb.appendChild(tr);
    });
    tb.onchange = e=>{
      const i = +e.target.dataset.i;
      if(e.target.classList.contains("pick")) importRows[i].pick = e.target.checked;
      else if(e.target.dataset.f) importRows[i][e.target.dataset.f] = e.target.value;
    };
    tb.oninput = tb.onchange;
    card.querySelector("#allChk").onchange = e=>{
      importRows.forEach(r=>{ if(r.status!=="dup") r.pick = e.target.checked; });
      renderPreview();
    };

    const gsel = card.querySelector("#gsel");
    const gname = card.querySelector("#gname");
    gsel.innerHTML = '<option value="">（不加入）</option>' +
      Store.data.groups.map(g=>'<option value="'+g.id+'">'+esc(g.name)+'</option>').join("") +
      '<option value="__new">＋ 新建單字組…</option>';
    if(pendingImportGroup && Store.group(pendingImportGroup)) gsel.value = pendingImportGroup;
    gsel.onchange = ()=>{ gname.style.display = gsel.value==="__new" ? "" : "none"; };

    const retry = card.querySelector("#retryBtn");
    if(retry) retry.onclick = async ()=>{
      importRows.forEach(r=>{ if(r.status==="err"){ r.status="new"; r.need=true; r.error=""; } });
      const errs = importRows.filter(r=>r.need);
      retry.disabled = true;
      await Lookup.run(errs, ()=>renderPreview());
      renderPreview();
    };

    card.querySelector("#doImport").onclick = ()=>{
      const picks = importRows.filter(r=>r.pick && r.status!=="dup" && r.term.trim());
      if(!picks.length){ toast("沒有要匯入的單字"); return; }
      const ids = [];
      picks.forEach(r=>{
        const exist = Store.findByTerm(r.term);
        if(exist){ ids.push(exist.id); return; }
        ids.push(Store.addWord(r).id);
      });
      /* 已存在但使用者在預覽中勾選的，也一併加入組 */
      importRows.filter(r=>r.status==="dup"&&r.existId).forEach(r=>{ if(!ids.includes(r.existId)) ids.push(r.existId); });

      let gid = gsel.value;
      if(gid==="__new"){
        const g = Store.addGroup(gname.value || ("單字組 "+(Store.data.groups.length+1)));
        gid = g.id;
      }
      if(gid){ Store.addToGroup(gid, ids); Store.data.focusGroup = gid; }
      Store.save();
      importRows = [];
      pendingImportGroup = "";
      document.querySelector("#imp") && (document.querySelector("#imp").value="");
      toast("已匯入 "+picks.length+" 個單字");
      UI.go("words");
    };
  }
};

/* ---------------- 單字庫 ---------------- */
let wordFilter = { q:"", sort:"new", only:"" };
const selected = new Set();
Views.words = function(root){
  const all = Store.focusWords();
  root.appendChild(el(`
  <div class="card">
    <div class="row" style="margin-bottom:6px">
      <h1 style="flex:1">單字庫</h1>
      <button class="btn sm" id="toRead" title="不顯示勾選與編輯，只專心看單字">👀 專心看</button>
    </div>
    <div class="row" style="margin-bottom:10px">
      <input type="text" id="q" placeholder="搜尋單字或中文…" value="${esc(wordFilter.q)}" style="flex:2;min-width:150px">
      <select id="sort" style="flex:1;min-width:120px">
        <option value="new">最新加入</option>
        <option value="az">字母順序</option>
        <option value="weak">最不熟優先</option>
      </select>
      <select id="only" style="flex:1;min-width:110px">
        <option value="">全部</option>
        <option value="weak">只看不熟</option>
        <option value="known">只看已熟</option>
        <option value="miss">缺中文</option>
      </select>
    </div>
    <div class="row" id="bulk" style="margin-bottom:8px"></div>
    <ul class="wlist" id="list"></ul>
  </div>`));
  root.querySelector("#sort").value = wordFilter.sort;
  root.querySelector("#only").value = wordFilter.only;
  root.querySelector("#toRead").onclick = ()=>UI.go("read");

  const onChange = ()=>{
    wordFilter.q = root.querySelector("#q").value;
    wordFilter.sort = root.querySelector("#sort").value;
    wordFilter.only = root.querySelector("#only").value;
    draw();
  };
  root.querySelector("#q").oninput = onChange;
  root.querySelector("#sort").onchange = onChange;
  root.querySelector("#only").onchange = onChange;

  draw();

  function filtered(){
    let ws = all.slice();
    const q = Store.norm(wordFilter.q);
    if(q) ws = ws.filter(w=>Store.norm(w.term).includes(q) || (w.zh||"").includes(wordFilter.q.trim()));
    if(wordFilter.only==="weak")  ws = ws.filter(w=>(w.stats?.box||1)<=2);
    if(wordFilter.only==="known") ws = ws.filter(w=>(w.stats?.box||1)>=4);
    if(wordFilter.only==="miss")  ws = ws.filter(w=>!w.zh);
    if(wordFilter.sort==="az") ws.sort((a,b)=>a.term.localeCompare(b.term));
    else if(wordFilter.sort==="weak") ws.sort((a,b)=>(a.stats?.box||1)-(b.stats?.box||1) || (a.stats?.lastSeen||0)-(b.stats?.lastSeen||0));
    else ws.sort((a,b)=>b.createdAt-a.createdAt);
    return ws;
  }
  function draw(){
    const ws = filtered();
    const list = root.querySelector("#list");
    const bulk = root.querySelector("#bulk");
    if(!ws.length){
      list.innerHTML = '<div class="empty"><div class="big">📖</div>'+
        (Object.keys(Store.data.words).length? "沒有符合的單字" : "還沒有單字，先去「匯入」加一些吧")+'</div>';
      bulk.innerHTML=""; return;
    }
    bulk.innerHTML = `<label class="chip"><input type="checkbox" id="selAll" style="width:auto;min-height:0"> 全選(${ws.length})</label>
      <span class="muted" style="font-size:13px" id="selCount"></span><span style="flex:1"></span>
      <button class="btn sm" id="toGroup">加入組別</button>
      <button class="btn sm" id="mkKnown">標為熟</button>
      <button class="btn sm" id="mkWeak">標為不熟</button>
      <button class="btn sm" id="reset">重置熟練度</button>
      <button class="btn sm danger" id="del">刪除</button>`;

    list.innerHTML = ws.map(w=>`
      <li data-id="${w.id}">
        <input type="checkbox" class="sel" data-id="${w.id}" style="width:auto;min-height:0"${selected.has(w.id)?" checked":""}>
        <span class="boxdot b${w.stats?.box||1}" title="熟練度 ${w.stats?.box||1}/5"></span>
        <div class="wmain">
          <div class="wterm">${esc(w.term)}
            ${w.phonetic?'<span class="muted" style="font-size:12px">'+esc(w.phonetic)+'</span>':''}</div>
          <div class="wsub">${w.zh?wordSenses(w).map(x=>'<span class="sense">'+senseHTML(x)+'</span>').join(""):'<span style="color:var(--bad)">（缺中文）</span>'}</div>
        </div>
        ${speakBtn(w.term)}
        <button class="btn sm ghost" data-edit="${w.id}">編輯</button>
      </li>`).join("");

    const cnt = ()=>{ const c=root.querySelector("#selCount"); if(c) c.textContent = selected.size? "已選 "+selected.size : ""; };
    cnt();
    list.onchange = e=>{
      if(!e.target.classList.contains("sel")) return;
      const id = e.target.dataset.id;
      e.target.checked ? selected.add(id) : selected.delete(id);
      cnt();
    };
    bulk.querySelector("#selAll").onchange = e=>{
      ws.forEach(w=> e.target.checked ? selected.add(w.id) : selected.delete(w.id));
      draw();
    };
    list.onclick = e=>{
      const b = e.target.closest("[data-edit]");
      if(b) editWord(b.dataset.edit, draw);
    };
    bulk.querySelector("#del").onclick = ()=>{
      if(!selected.size){ toast("請先勾選單字"); return; }
      if(!confirm("確定刪除 "+selected.size+" 個單字？此動作無法復原。")) return;
      Store.deleteWords([...selected]); selected.clear();
      UI.render();
    };
    bulk.querySelector("#toGroup").onclick = ()=>{
      if(!selected.size){ toast("請先勾選單字"); return; }
      pickGroup(gid=>{ const n=Store.addToGroup(gid,[...selected]); toast("已加入 "+n+" 個單字"); selected.clear(); UI.render(); });
    };
    bulk.querySelector("#mkKnown").onclick = ()=>{
      if(!selected.size){ toast("請先勾選單字"); return; }
      Store.setBox([...selected], 5);
      toast("已把 "+selected.size+" 個單字標為熟"); selected.clear(); UI.render();
    };
    bulk.querySelector("#mkWeak").onclick = ()=>{
      if(!selected.size){ toast("請先勾選單字"); return; }
      Store.setBox([...selected], 1);
      toast("已把 "+selected.size+" 個單字標為不熟"); selected.clear(); UI.render();
    };
    bulk.querySelector("#reset").onclick = ()=>{
      if(!selected.size){ toast("請先勾選單字"); return; }
      if(!confirm("把 "+selected.size+" 個單字的熟練度與答題紀錄歸零？單字本身不會被刪除。")) return;
      const n = Store.resetStats([...selected]);
      toast("已重置 "+n+" 個單字"); selected.clear(); UI.render();
    };
  }
};

function editWord(id, after){
  const w = Store.data.words[id]; if(!w) return;
  const m = modal(`<h2>編輯單字</h2>
    <label class="field"><span>單字</span><input type="text" id="e_term" value="${esc(w.term)}"></label>
    <div class="field" style="margin-bottom:12px">
      <span style="display:block;font-size:13px;color:var(--muted);margin-bottom:5px">詞性與中文（有多種詞性就各加一行）</span>
      <div id="e_senses" style="display:grid;gap:6px"></div>
      <button class="btn sm ghost" id="e_addS" style="margin-top:6px">＋ 新增詞性</button>
    </div>
    <label class="field"><span>音標</span><input type="text" id="e_ph" value="${esc(w.phonetic)}"></label>
    <label class="field"><span>例句</span><input type="text" id="e_ex" value="${esc(w.example)}"></label>
    <div class="muted" style="font-size:13px;margin-bottom:6px">熟練度 ${w.stats?.box||1}/5・答對 ${w.stats?.correct||0}・答錯 ${w.stats?.wrong||0}</div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn sm" id="e_known">標為熟</button>
      <button class="btn sm" id="e_weak">標為不熟</button>
      <button class="btn sm ghost" id="e_reset">重置紀錄</button>
    </div>
    <div class="row end">
      <button class="btn sm" id="e_look">重新查詢</button>
      <button class="btn ghost" id="e_cancel">取消</button>
      <button class="btn primary" id="e_save">儲存</button>
    </div>`);
  const sBox = m.querySelector("#e_senses");
  const drawSenses = arr=>{
    sBox.innerHTML = arr.map(x=>`<div class="row" style="flex-wrap:nowrap">
      <input type="text" class="s_pos" value="${esc(x.pos)}" placeholder="n." style="width:70px;flex:none">
      <input type="text" class="s_zh" value="${esc(x.zh)}" placeholder="中文" style="flex:1;min-width:0">
      <button class="btn sm ghost danger s_del" title="刪除這組">✕</button></div>`).join("");
  };
  const readSenses = ()=>[...sBox.children].map(r=>({ pos:r.querySelector(".s_pos").value, zh:r.querySelector(".s_zh").value }));
  drawSenses(wordSenses(w));
  m.querySelector("#e_addS").onclick = ()=>{ drawSenses([...readSenses(), {pos:"",zh:""}]); sBox.lastElementChild.querySelector(".s_pos").focus(); };
  sBox.onclick = e=>{
    const b = e.target.closest(".s_del"); if(!b) return;
    b.parentElement.remove();
    if(!sBox.children.length) drawSenses([{pos:"",zh:""}]);
  };
  m.querySelector("#e_cancel").onclick = ()=>m.close();
  m.querySelector("#e_known").onclick = ()=>{ Store.setBox([id],5); m.close(); after&&after(); toast("已標為熟"); };
  m.querySelector("#e_weak").onclick  = ()=>{ Store.setBox([id],1); m.close(); after&&after(); toast("已標為不熟"); };
  m.querySelector("#e_reset").onclick = ()=>{ Store.resetStats([id]); m.close(); after&&after(); toast("已重置紀錄"); };
  m.querySelector("#e_look").onclick = async e=>{
    e.target.disabled=true; e.target.textContent="查詢中…";
    const row = { term:m.querySelector("#e_term").value, pos:"", zh:"", phonetic:"", example:"", need:true, status:"new" };
    delete Store.data.cache[Store.norm(row.term)];
    await Lookup.run([row]);
    if(row.status==="err"){ toast("查詢失敗："+row.error); }
    else{
      if(row.zh || row.pos) drawSenses(parseSenses(row.zh, row.pos));
      m.querySelector("#e_ph").value  = row.phonetic || m.querySelector("#e_ph").value;
      m.querySelector("#e_ex").value  = row.example  || m.querySelector("#e_ex").value;
    }
    e.target.disabled=false; e.target.textContent="重新查詢";
  };
  m.querySelector("#e_save").onclick = ()=>{
    w.term = m.querySelector("#e_term").value.trim() || w.term;
    setSenses(w, readSenses());
    w.phonetic = m.querySelector("#e_ph").value.trim();
    w.example  = m.querySelector("#e_ex").value.trim();
    Store.save(); m.close(); after && after(); toast("已儲存");
  };
}
/* 貼上多行單字，從單字庫比對後加進指定的組。
   解析沿用 parseImport，所以逗號/直線/Tab 格式與匯入頁一致，同一份清單可直接重貼。 */
function bulkAddToGroup(gid){
  const g = Store.group(gid); if(!g) return;
  const m = modal(`<h2>批次加入「${esc(g.name)}」</h2>
    <p class="hint">一行一個單字，只會從<b>單字庫既有的單字</b>裡撈。<br>
      格式和匯入頁一樣，貼 <code>apple, 蘋果</code> 這種也可以，只會看第一欄。</p>
    <textarea id="b_txt" rows="8" placeholder="apple&#10;determine&#10;resilient"></textarea>
    <div id="b_stat" class="muted" style="font-size:13px;margin:10px 0"></div>
    <div id="b_missWrap" style="display:none">
      <h3 style="margin-top:4px">單字庫裡沒有的（<span id="b_missN"></span>）</h3>
      <div id="b_miss" style="font-size:13px;max-height:120px;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:10px"></div>
      <button class="btn sm" id="b_toImport">把這些帶去匯入頁建立</button>
    </div>
    <div class="row end" style="margin-top:14px">
      <button class="btn ghost" id="b_cancel">取消</button>
      <button class="btn primary" id="b_ok" disabled>加入</button>
    </div>`);

  const txt = m.querySelector("#b_txt");
  let found=[], already=[], miss=[];

  const scan = ()=>{
    const terms = parseImport(txt.value).map(r=>r.term);
    found=[]; already=[]; miss=[];
    terms.forEach(t=>{
      const w = Store.findByTerm(t);
      if(!w) miss.push(t);
      else if(g.wordIds.includes(w.id)) already.push(w);
      else found.push(w);
    });
    m.querySelector("#b_stat").innerHTML =
      terms.length
        ? `共 ${terms.length} 行・<b style="color:var(--ok)">可加入 ${found.length}</b>・已在組內 ${already.length}・查無 ${miss.length}`
        : "";
    m.querySelector("#b_ok").disabled = !found.length;
    m.querySelector("#b_ok").textContent = found.length? "加入 "+found.length+" 個單字" : "加入";
    const mw = m.querySelector("#b_missWrap");
    mw.style.display = miss.length? "block" : "none";
    if(miss.length){
      m.querySelector("#b_missN").textContent = miss.length;
      m.querySelector("#b_miss").textContent = miss.join("、");
    }
  };
  txt.oninput = scan;
  setTimeout(()=>txt.focus(), 60);

  m.querySelector("#b_cancel").onclick = ()=>m.close();
  m.querySelector("#b_toImport").onclick = ()=>{
    pendingImport = miss.join(String.fromCharCode(10));
    pendingImportGroup = gid;
    m.close(); UI.go("import");
  };
  m.querySelector("#b_ok").onclick = ()=>{
    const n = Store.addToGroup(gid, found.map(w=>w.id));
    m.close(); UI.render();
    toast("已加入 "+n+" 個單字"+(miss.length? "（"+miss.length+" 個單字庫裡沒有）":""));
  };
}

function modal(html){
  const back = el('<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto"></div>');
  const box = el('<div class="card" style="max-width:440px;width:100%;margin:auto;max-height:90vh;overflow:auto"></div>');
  box.innerHTML = html;
  back.appendChild(box);
  back.onclick = e=>{ if(e.target===back) back.remove(); };
  document.body.appendChild(back);
  box.close = ()=>back.remove();
  return box;
}

/* ---------------- 組別 ---------------- */
Views.groups = function(root){
  root.appendChild(el(`<div class="card">
    <h1>單字組</h1>
    <p class="hint">把單字分組，背誦與測驗就能只專注在這一組。</p>
    <div class="row"><input type="text" id="ng" placeholder="新單字組名稱" style="flex:1;min-width:170px">
      <button class="btn primary" id="addg">建立</button></div>
  </div>
  <div class="grid" id="gg" style="margin-top:14px"></div>`));

  const add = ()=>{
    const v = root.querySelector("#ng").value.trim();
    if(!v){ toast("請輸入名稱"); return; }
    Store.addGroup(v); root.querySelector("#ng").value=""; UI.render(); toast("已建立");
  };
  root.querySelector("#addg").onclick = add;
  root.querySelector("#ng").onkeydown = e=>{ if(e.key==="Enter") add(); };

  const gg = root.querySelector("#gg");
  if(!Store.data.groups.length){
    gg.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🗂</div>還沒有單字組</div>';
    return;
  }
  /* 找出和這組重疊最多的另一組，重疊超過一半才提示，方便決定要不要刪掉重複的組 */
  const sets = Store.data.groups.map(g=>new Set(g.wordIds));
  const overlap = gi=>{
    let best = null;
    sets.forEach((st,j)=>{
      if(j===gi) return;
      let n = 0; sets[gi].forEach(id=>{ if(st.has(id)) n++; });
      if(n && (!best || n>best.n)) best = { n, j };
    });
    if(!best || best.n < sets[gi].size/2) return "";
    return '<div class="muted" style="font-size:12px;margin-bottom:6px">⚠ '+
      (best.n===sets[gi].size ? '全部 '+best.n+' 個字也都' : '有 '+best.n+' 個字也')+
      '在「'+esc(Store.data.groups[best.j].name)+'」</div>';
  };
  gg.innerHTML = Store.data.groups.map((g,gi)=>{
    const ws = Store.groupWords(g.id);
    const m = Store.mastery(ws);
    return `<div class="card" style="margin:0">
      <h2 style="display:flex;align-items:center;gap:8px"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(g.name)}</span>
        <button class="btn sm ghost" data-ren="${g.id}">✎</button>
        <button class="btn sm ghost danger" data-del="${g.id}">🗑</button></h2>
      <div class="muted" style="font-size:13px;margin-bottom:6px">${ws.length} 個單字・熟練 ${m}%</div>
      <div class="bar" style="margin-bottom:12px"><i style="width:${m}%"></i></div>
      ${overlap(gi)}
      <div class="row">
        <button class="btn sm primary" data-study="${g.id}">背誦</button>
        <button class="btn sm" data-quiz="${g.id}">測驗</button>
        <button class="btn sm ghost" data-view="${g.id}">看單字</button>
        <button class="btn sm ghost" data-read="${g.id}">專心看</button>
        <button class="btn sm" data-bulk="${g.id}" title="貼上多行單字，從單字庫撈進這組">批次加入</button>
        <button class="btn sm ghost" data-reset="${g.id}" title="把這組的熟練度歸零">重置</button>
      </div>
    </div>`;
  }).join("");

  gg.onclick = e=>{
    const b = e.target.closest("button[data-ren],button[data-del],button[data-study],button[data-quiz],button[data-view],button[data-read],button[data-reset],button[data-bulk]");
    if(!b) return;
    const d = b.dataset;
    if(d.bulk){ bulkAddToGroup(d.bulk); return; }
    if(d.reset){
      const g = Store.group(d.reset);
      if(!confirm('把「'+g.name+'」裡 '+g.wordIds.length+' 個單字的熟練度歸零？單字不會被刪除。')) return;
      const n = Store.resetStats(g.wordIds);
      toast("已重置 "+n+" 個單字"); UI.render(); return;
    }
    if(d.ren){
      const g = Store.group(d.ren);
      const nm = prompt("新名稱", g.name);
      if(nm && nm.trim()){ g.name = nm.trim(); Store.save(); UI.render(); }
    } else if(d.del){
      const g = Store.group(d.del);
      if(!confirm('刪除單字組「'+g.name+'」？組裡的單字會保留在單字庫。')) return;
      Store.data.groups = Store.data.groups.filter(x=>x.id!==d.del);
      if(Store.data.focusGroup===d.del) Store.data.focusGroup="all";
      Store.save(); UI.render();
    } else if(d.study||d.quiz||d.view||d.read){
      Store.data.focusGroup = d.study||d.quiz||d.view||d.read; Store.save();
      UI.go(d.study? "study" : d.quiz? "quiz" : d.read? "read" : "words");
    }
  };
};

/* ---------------- 專心看 ----------------
   純瀏覽目前範圍的單字：沒有勾選框、沒有編輯按鈕，
   可以遮住中文或英文，點一下單字再翻開來自我檢查。 */
let readCfg = { sort:"az", only:"", hide:"", ex:true };
let readOrder = null;   /* 隨機排序時記住順序，避免每次重畫都洗牌 */
const revealed = new Set();
Views.read = function(root){
  const all = Store.focusWords();
  const gname = Store.group(Store.data.focusGroup)?.name || "全部單字";
  root.appendChild(el(`
  <div class="card" style="margin-bottom:14px">
    <div class="row" style="margin-bottom:4px">
      <h1 style="flex:1">專心看單字</h1>
      <button class="btn sm ghost" id="r_back">回單字庫</button>
    </div>
    <p class="hint">範圍：${esc(gname)}（${all.length} 個）・可從上方選單切換單字組</p>
    <div class="row" style="margin-bottom:10px">
      <select id="r_sort" style="flex:1;min-width:120px">
        <option value="az">字母順序</option>
        <option value="new">最新加入</option>
        <option value="weak">最不熟優先</option>
        <option value="rand">隨機</option>
      </select>
      <select id="r_only" style="flex:1;min-width:110px">
        <option value="">全部</option>
        <option value="weak">只看不熟</option>
        <option value="known">只看已熟</option>
      </select>
    </div>
    <div class="row" id="r_hide">
      <span class="muted" style="font-size:13px">遮住：</span>
      <button class="chip" data-h="">不遮</button>
      <button class="chip" data-h="zh">中文</button>
      <button class="chip" data-h="en">英文</button>
      <span style="flex:1"></span>
      <button class="chip" id="r_ex">例句</button>
      <button class="chip" id="r_revAll" style="display:none">全部翻開</button>
    </div>
  </div>
  <ul class="rlist" id="r_list"></ul>`));

  const $ = s=>root.querySelector(s);
  $("#r_sort").value = readCfg.sort;
  $("#r_only").value = readCfg.only;
  $("#r_back").onclick = ()=>UI.go("words");
  $("#r_sort").onchange = e=>{ readCfg.sort = e.target.value; readOrder = null; draw(); };
  $("#r_only").onchange = e=>{ readCfg.only = e.target.value; draw(); };
  $("#r_hide").onclick = e=>{
    const b = e.target.closest("[data-h]"); if(!b) return;
    readCfg.hide = b.dataset.h; revealed.clear(); draw();
  };
  $("#r_ex").onclick = ()=>{ readCfg.ex = !readCfg.ex; draw(); };
  $("#r_revAll").onclick = ()=>{
    const allOpen = list().every(w=>revealed.has(w.id));
    list().forEach(w=> allOpen ? revealed.delete(w.id) : revealed.add(w.id));
    draw();
  };
  $("#r_list").onclick = e=>{
    if(e.target.closest("[data-speak]")) return;
    const li = e.target.closest("li[data-id]");
    if(!li || !readCfg.hide) return;
    const id = li.dataset.id;
    revealed.has(id) ? revealed.delete(id) : revealed.add(id);
    draw();
  };
  draw();

  function list(){
    let ws = all.slice();
    if(readCfg.only==="weak")  ws = ws.filter(w=>(w.stats?.box||1)<=2);
    if(readCfg.only==="known") ws = ws.filter(w=>(w.stats?.box||1)>=4);
    if(readCfg.sort==="az") ws.sort((a,b)=>a.term.localeCompare(b.term));
    else if(readCfg.sort==="new") ws.sort((a,b)=>b.createdAt-a.createdAt);
    else if(readCfg.sort==="weak") ws.sort((a,b)=>(a.stats?.box||1)-(b.stats?.box||1) || a.term.localeCompare(b.term));
    else{
      if(!readOrder) readOrder = shuffle(all.map(w=>w.id));
      const pos = new Map(readOrder.map((id,i)=>[id,i]));
      ws.sort((a,b)=>(pos.get(a.id)??1e9)-(pos.get(b.id)??1e9));
    }
    return ws;
  }
  function draw(){
    root.querySelectorAll("#r_hide [data-h]").forEach(b=>b.classList.toggle("on", b.dataset.h===readCfg.hide));
    $("#r_ex").classList.toggle("on", readCfg.ex);
    $("#r_revAll").style.display = readCfg.hide ? "" : "none";
    const ws = list();
    const ul = $("#r_list");
    if(!ws.length){
      ul.innerHTML = '<li style="display:block"><div class="empty"><div class="big">👀</div>'+
        (all.length? "沒有符合的單字" : "這個範圍還沒有單字，先去「匯入」加一些吧")+'</div></li>';
      return;
    }
    ul.innerHTML = ws.map((w,i)=>{
      const open = revealed.has(w.id);
      const cov = side => readCfg.hide===side && !open ? ' class="cover" title="點一下翻開"' : '';
      return `<li data-id="${w.id}">
        <span class="rnum">${i+1}</span>
        <div class="rmain">
          <div class="rterm"><span${cov("en")}>${esc(w.term)}</span>
            ${w.phonetic?'<span class="rph"><span'+cov("en")+'>'+esc(w.phonetic)+'</span></span>':''}</div>
          ${w.zh ? wordSenses(w).map(x=>'<div class="rzh"><span'+cov("zh")+'>'+senseHTML(x)+'</span></div>').join("")
                 : '<div class="rzh"><span'+cov("zh")+'><span class="muted">（未填中文）</span></span></div>'}
          ${readCfg.ex && w.example?'<div class="rex"><span'+cov("en")+'>'+esc(w.example)+'</span></div>':''}
        </div>
        ${speakBtn(w.term)}
      </li>`;
    }).join("");
  }
};

/* ---------------- 背誦 Flashcard ---------------- */
let study = null;
Views.study = function(root){
  const pool = Store.focusWords();
  if(!pool.length){
    root.appendChild(el('<div class="card"><div class="empty"><div class="big">🃏</div>這個範圍還沒有單字<br><br><button class="btn primary" id="goimp">去匯入單字</button></div></div>'));
    root.querySelector("#goimp").onclick=()=>UI.go("import");
    return;
  }
  if(!study || study.gid !== Store.data.focusGroup || !study.queue.length){
    /* Leitner：低盒優先、久未見優先，再加一點隨機 */
    const q = pool.slice().sort((a,b)=>{
      const ba=(a.stats?.box||1), bb=(b.stats?.box||1);
      if(ba!==bb) return ba-bb;
      return (a.stats?.lastSeen||0)-(b.stats?.lastSeen||0);
    }).slice(0, Math.max(20, Math.ceil(pool.length*0.6)));
    study = { gid:Store.data.focusGroup, queue:shuffle(q), i:0, flip:false, know:0, no:0 };
  }
  draw();

  function draw(){
    if(study.i >= study.queue.length){
      root.innerHTML = "";
      root.appendChild(el(`<div class="card">
        <h1>這一輪結束</h1>
        <div class="score">${study.know}/${study.queue.length}</div>
        <p class="hint" style="text-align:center">認識 ${study.know}・不熟 ${study.no}</p>
        <div class="row end"><button class="btn" id="again">再來一輪</button><button class="btn primary" id="toquiz">去測驗</button></div>
      </div>`));
      root.querySelector("#again").onclick=()=>{ study=null; UI.render(); };
      root.querySelector("#toquiz").onclick=()=>{ study=null; UI.go("quiz"); };
      return;
    }
    const w = study.queue[study.i];
    const zh2en = Store.data.settings.studyDir === "zh2en";
    const enSide =
      `<div class="term">${esc(w.term)} ${speakBtn(w.term)}</div>
       ${w.phonetic?'<div class="ph">'+esc(w.phonetic)+'</div>':''}`;
    const zhSide =
      w.zh ? wordSenses(w).map(x=>'<div class="zh">'+senseHTML(x)+'</div>').join("") : '<div class="zh">（未填中文）</div>';
    const tapHint = '<div class="muted" style="font-size:13px">點一下看答案</div>';
    /* 正面只給提示，背面才給完整資訊＋例句 */
    const front = zh2en ? (zhSide + tapHint) : (enSide + tapHint);
    const back  = zh2en
      ? (zhSide + enSide + (w.example?'<div class="ex">'+esc(w.example)+'</div>':''))
      : (enSide + zhSide + (w.example?'<div class="ex">'+esc(w.example)+'</div>':''));
    root.innerHTML = "";
    root.appendChild(el(`
      <div class="row" style="margin-bottom:10px">
        <span class="muted" style="font-size:13px">${study.i+1} / ${study.queue.length}</span>
        <div class="bar" style="flex:1"><i style="width:${study.i/study.queue.length*100}%"></i></div>
        <button class="chip" id="dirBtn" title="切換卡片正面">${zh2en?"中 → 英":"英 → 中"}</button>
      </div>
      <div class="flash" id="fc">
        ${ study.flip ? back : front }
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="no" style="flex:1">不熟 (←)</button>
        <button class="btn primary" id="yes" style="flex:1">認識 (→)</button>
      </div>
      <p class="hint" style="text-align:center;margin-top:10px">空白鍵翻面・手機可左右滑動</p>`));

    const fc = root.querySelector("#fc");
    fc.onclick = e=>{ if(e.target.closest("[data-speak]")) return; study.flip=!study.flip; draw(); };
    /* 中→英模式若在正面就唸出來等於直接給答案，所以改成翻面後才唸 */
    if(zh2en ? study.flip : !study.flip) autoSay(w.term);

    root.querySelector("#dirBtn").onclick = e=>{
      e.stopPropagation();
      Store.data.settings.studyDir = zh2en ? "en2zh" : "zh2en";
      Store.save(); study.flip = false; draw();
      toast(zh2en ? "卡片正面：英文" : "卡片正面：中文");
    };

    root.querySelector("#yes").onclick = ()=>grade(true);
    root.querySelector("#no").onclick  = ()=>grade(false);

    /* swipe */
    let x0=null;
    fc.ontouchstart = e=>{ x0 = e.touches[0].clientX; };
    fc.ontouchend = e=>{
      if(x0===null) return;
      const dx = e.changedTouches[0].clientX - x0; x0=null;
      if(Math.abs(dx) > 70) grade(dx>0);
    };
  }
  function grade(ok){
    const w = study.queue[study.i];
    Store.grade(w, ok);
    ok ? study.know++ : study.no++;
    Store.save();
    study.i++; study.flip=false; draw();
  }
};

/* ---------------- 測驗 ---------------- */
let quiz = null;
const MODES = [
  { id:"match",  label:"中英配對" },
  { id:"recall", label:"中譯英" },
  { id:"spell",  label:"拼字填空" },
  { id:"choice", label:"四選一" },
  { id:"listen", label:"聽力測驗" }
];
let quizCfg = { modes:["choice","spell"], count:10, scope:"focus", hint:true, rounds:2 };
let pickQ = "";
/* 自選單字：每個單字組各記一份勾選清單，存在 localStorage，下次打開還在 */
function quizPicks(){
  if(!Store.data.quizPicks) Store.data.quizPicks = {};
  const k = Store.data.focusGroup || "all";
  if(!Store.data.quizPicks[k]) Store.data.quizPicks[k] = [];
  return Store.data.quizPicks[k];
}

Views.quiz = function(root){
  if(quiz){ renderQuiz(root); return; }

  const pool = poolFor(quizCfg.scope);
  root.appendChild(el(`<div class="card">
    <h1>測驗</h1>
    <p class="hint">從「${esc(Store.group(Store.data.focusGroup)?.name || "全部單字")}」出題。缺中文的單字會自動略過。</p>
    <label class="field"><span>題型（可複選，混合出題）</span>
      <div class="row" id="modes">${MODES.map(m=>
        '<button class="chip'+(quizCfg.modes.includes(m.id)?" on":"")+'" data-m="'+m.id+'">'+m.label+'</button>').join("")}</div>
    </label>
    <label class="field"><span>範圍</span><select id="scope">
      <option value="focus">目前選取的範圍</option>
      <option value="weak">只考不熟的（熟練度 ≤2）</option>
      <option value="all">全部單字</option>
      <option value="pick">自選單字，重複練習</option>
    </select></label>
    <div id="pickWrap" style="display:none;margin-bottom:12px">
      <input type="text" id="pickQ" placeholder="搜尋單字或中文…" style="margin-bottom:8px">
      <div class="row" style="margin-bottom:8px">
        <button class="chip" id="pickAll">全選</button>
        <button class="chip" id="pickNone">全不選</button>
        <button class="chip" id="pickWeak">加選不熟的</button>
        <span class="muted" style="font-size:13px;margin-left:auto" id="pickN"></span>
      </div>
      <div class="picklist" id="pickList"></div>
    </div>
    <label class="field" id="countWrap"><span>題數</span><select id="count">
      <option>5</option><option>10</option><option>20</option><option>30</option><option>50</option>
    </select></label>
    <label class="field" id="roundsWrap" style="display:none"><span>每個單字練幾輪（每輪換題型、打亂順序）</span><select id="rounds">
      <option>1</option><option>2</option><option>3</option><option>5</option>
    </select></label>
    <label class="row" style="margin-bottom:14px"><input type="checkbox" id="hint" style="width:auto;min-height:0"${quizCfg.hint?" checked":""}> <span style="font-size:14px">拼字填空顯示字母提示（a _ _ l e）</span></label>
    <p class="hint" style="margin:-8px 0 12px">「中譯英」不受這個選項影響，一律不給提示。</p>
    <div class="muted" style="font-size:13px;margin-bottom:10px" id="cnt">可出題單字：${pool.length}</div>
    <button class="btn primary" id="start" style="width:100%">開始測驗</button>
  </div>`));
  root.querySelector("#scope").value = quizCfg.scope;
  root.querySelector("#count").value = String(quizCfg.count);
  root.querySelector("#rounds").value = String(quizCfg.rounds);
  const $ = s=>root.querySelector(s);

  root.querySelector("#modes").onclick = e=>{
    const b = e.target.closest("[data-m]"); if(!b) return;
    const id = b.dataset.m;
    const i = quizCfg.modes.indexOf(id);
    if(i>=0){ if(quizCfg.modes.length===1){ toast("至少要選一種題型"); return; } quizCfg.modes.splice(i,1); }
    else quizCfg.modes.push(id);
    b.classList.toggle("on");
  };
  root.querySelector("#scope").onchange = e=>{ quizCfg.scope = e.target.value; refresh(); };
  $("#rounds").onchange = e=>{ quizCfg.rounds = +e.target.value || 1; refresh(); };

  /* ---- 自選單字清單 ---- */
  const cands = poolFor("focus").sort((a,b)=>a.term.localeCompare(b.term));
  const picks = quizPicks();
  /* 清掉已刪除或已不在這個範圍的單字 */
  const candIds = new Set(cands.map(w=>w.id));
  for(let i=picks.length-1;i>=0;i--) if(!candIds.has(picks[i])) picks.splice(i,1);
  const setPicks = ids=>{ picks.length=0; picks.push(...ids); Store.save(); drawPick(); };
  const shownCands = ()=>{
    const q = Store.norm(pickQ);
    return q ? cands.filter(w=>Store.norm(w.term).includes(q) || w.zh.includes(pickQ.trim())) : cands;
  };
  function drawPick(){
    const on = new Set(picks);
    const ws = shownCands();
    $("#pickList").innerHTML = ws.length ? ws.map(w=>`<label>
        <input type="checkbox" data-pid="${w.id}"${on.has(w.id)?" checked":""}>
        <span class="boxdot b${w.stats?.box||1}"></span>
        <b>${esc(w.term)}</b><span class="pz">${esc(w.zh)}</span></label>`).join("")
      : '<div class="empty" style="padding:20px">'+(cands.length?"沒有符合的單字":"這個範圍沒有可出題的單字")+'</div>';
    refresh();
  }
  $("#pickQ").value = pickQ;
  $("#pickQ").oninput = e=>{ pickQ = e.target.value; drawPick(); };
  $("#pickList").onchange = e=>{
    const id = e.target.dataset.pid; if(!id) return;
    const i = picks.indexOf(id);
    if(e.target.checked && i<0) picks.push(id);
    if(!e.target.checked && i>=0) picks.splice(i,1);
    Store.save(); refresh();
  };
  /* 全選／全不選只作用在目前搜尋到的單字 */
  $("#pickAll").onclick  = ()=>setPicks([...new Set([...picks, ...shownCands().map(w=>w.id)])]);
  $("#pickNone").onclick = ()=>{ const hide=new Set(shownCands().map(w=>w.id)); setPicks(picks.filter(id=>!hide.has(id))); };
  $("#pickWeak").onclick = ()=>setPicks([...new Set([...picks, ...cands.filter(w=>(w.stats?.box||1)<=2).map(w=>w.id)])]);

  function refresh(){
    const pick = quizCfg.scope==="pick";
    $("#pickWrap").style.display   = pick ? "" : "none";
    $("#roundsWrap").style.display = pick ? "" : "none";
    $("#countWrap").style.display  = pick ? "none" : "";
    $("#pickN").textContent = "已選 "+picks.length+" 個";
    $("#cnt").textContent = pick
      ? "已選 "+picks.length+" 個單字 × "+quizCfg.rounds+" 輪"
      : "可出題單字："+poolFor(quizCfg.scope).length;
  }
  drawPick();

  root.querySelector("#start").onclick = ()=>{
    quizCfg.count = +root.querySelector("#count").value || 10;   /* select 值不在清單中時會是空字串 */
    quizCfg.hint = root.querySelector("#hint").checked;
    if(quizCfg.scope==="pick"){
      const ws = picks.map(id=>Store.data.words[id]).filter(Boolean);
      if(!ws.length){ toast("請先勾選要練習的單字"); return; }
      /* 選項（干擾項）從整個範圍抽，所以選少少幾個字也能出四選一 */
      if(cands.length < 4){ toast("這個範圍可出題的單字太少（需要至少 4 個有中文的單字當選項）"); return; }
      quiz = buildQuiz(cands, ws, quizCfg.rounds);
    } else {
      const p = poolFor(quizCfg.scope);
      if(p.length < 4){ toast("可出題的單字太少（需要至少 4 個有中文的單字）"); return; }
      quiz = buildQuiz(p);
    }
    Speech.warm();
    UI.render();
  };

  function poolFor(scope){
    let ws = scope==="all" ? Object.values(Store.data.words) : Store.focusWords();
    if(scope==="weak") ws = ws.filter(w=>(w.stats?.box||1)<=2);
    return ws.filter(w=>w.zh && w.term);
  }
};

/* words：指定要考的單字（自選模式）；沒給就從 pool 挑，不熟的優先。
   rounds：每個單字考幾輪。每輪各自打亂、題型輪替，同一個字不會連續出現在同一輪裡 */
function buildQuiz(pool, words, rounds){
  let picked = words;
  if(!picked){
    const n = Math.max(1, Math.min(quizCfg.count||10, pool.length));
    picked = shuffle(pool).sort((a,b)=>(a.stats?.box||1)-(b.stats?.box||1)).slice(0, n);
  }
  const qs = [];
  for(let r=0; r<(rounds||1); r++) qs.push(...buildRound(picked, r));
  return { qs, i:0, right:0, wrong:0, missed:[], pool, words:picked, rounds:rounds||1, answered:false };
}
function buildRound(picked, offset){
  const qs = [];
  const modes = quizCfg.modes.slice();
  const rest = shuffle(picked);

  if(modes.includes("match")){
    /* 配對題把單字打包成每 5 個一題 */
    const groupCount = Math.max(1, Math.floor(rest.length / (modes.length*5)));
    for(let g=0; g<groupCount && rest.length>=4; g++){
      const items = rest.splice(0, Math.min(5, rest.length));
      if(items.length < 3){ rest.push(...items); break; }
      qs.push({ type:"match", items, senses:Object.fromEntries(items.map(w=>[w.id, pickSense(w)])) });
    }
  }
  const others = modes.filter(m=>m!=="match");
  /* 題型依單字在清單中的位置決定，每輪往後推一格，同一個字每輪換題型 */
  rest.forEach(w=>{
    const t = others.length ? others[(picked.indexOf(w)+offset) % others.length] : "choice";
    qs.push({ type:t, word:w, sense:pickSense(w) });
  });
  return shuffle(qs);
}

/* avoidZh：看中文選英文時，排除也有這個意思的字（例如 n. 廣告 → advertisement 與 commercial 都對） */
function distractors(word, pool, field, pos, avoidZh){
  const p = pos || word.pos;
  const avoid = new Set(zhItems(avoidZh));
  const clash = w=>avoid.size && zhItems(w.zh).some(x=>avoid.has(x));
  const same = pool.filter(w=>w.id!==word.id && p && wordSenses(w).some(x=>x.pos===p) && w[field] && !clash(w));
  const any  = pool.filter(w=>w.id!==word.id && w[field] && !clash(w));
  const src  = same.length>=3 ? same : any;
  const out = [];
  for(const w of shuffle(src)){
    if(out.length>=3) break;
    if(out.some(o=>o[field]===w[field]) || w[field]===word[field]) continue;
    out.push(w);
  }
  return out;
}

function renderQuiz(root){
  if(!quiz.qs.length && !quiz.right && !quiz.wrong){
    root.innerHTML = "";
    root.appendChild(el('<div class="card"><div class="empty"><div class="big">✏️</div>沒有可出題的單字<br><span style="font-size:13px">測驗只會考「有填中文」的單字</span><br><br><button class="btn primary" id="backQ">回測驗設定</button></div></div>'));
    root.querySelector("#backQ").onclick = ()=>{ quiz=null; UI.render(); };
    return;
  }
  const q = quiz.qs[quiz.i];
  if(!q){ renderResult(root); return; }
  const total = quiz.qs.length;
  root.innerHTML = "";
  const head = el(`<div class="qhead">
    <span class="muted" style="font-size:13px">${quiz.i+1}/${total}</span>
    <div class="bar"><i style="width:${quiz.i/total*100}%"></i></div>
    <span style="font-size:13px;color:var(--ok)">✓${quiz.right}</span>
    <span style="font-size:13px;color:var(--bad)">✗${quiz.wrong}</span>
    <button class="btn sm ghost" id="quitQ">結束</button>

  root.appendChild(head);
