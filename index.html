  const card = el('<div class="card"></div>');
  root.appendChild(card);
  ({ match:qMatch, spell:qSpell, choice:qChoice, listen:qListen,
     recall:(c,x)=>qSpell(c, x, false, true) })[q.type](card, q);
}

function next(){ quiz.i++; UI.render(); }
/* 作答後不自動跳題，顯示「下一題」按鈕，看完答案再自己按（Enter 也可以） */
function waitNext(card, before){
  const last = quiz.i >= quiz.qs.length-1;
  const b = el('<button class="btn primary" id="nextQ" style="width:100%;margin-top:12px">'+(last?"看結果":"下一題 →")+'</button>');
  card.appendChild(b);
  b.onclick = ()=>{ before && before(); next(); };
  setTimeout(()=>b.focus(), 30);
}
function mark(w, ok){
  Store.grade(w, ok);
  ok ? quiz.right++ : quiz.wrong++;
  if(!ok && !quiz.missed.some(m=>m.id===w.id)) quiz.missed.push(w);
  Store.save();
}

/* --- 四選一 --- */
/* 中文干擾選項：從別的單字挑一組意思，盡量挑同詞性的，也避開這個字自己的任何一組意思 */
function zhDistractors(word, sense, pool){
  const mine = new Set(zhItems(word.zh));
  const cands = [];
  shuffle(pool).forEach(o=>{
    if(o.id===word.id) return;
    const os = wordSenses(o).filter(x=>x.zh && !zhItems(x.zh).some(z=>mine.has(z)));
    if(!os.length) return;
    const same = os.filter(x=>sense.pos && x.pos===sense.pos);
    const src = same.length ? same : os;
    cands.push({ text:src[Math.floor(Math.random()*src.length)].zh, same:same.length>0 });
  });
  const sameOnes = cands.filter(c=>c.same);
  const out = [];
  for(const c of (sameOnes.length>=3 ? sameOnes : cands)){
    if(out.length>=3) break;
    if(!out.includes(c.text)) out.push(c.text);
  }
  return out;
}
function qChoice(card, q){
  const w = q.word, s = q.sense || pickSense(w);
  const en2zh = Math.random() < 0.5;
  let opts;
  if(en2zh){
    const ds = zhDistractors(w, s, quiz.pool);
    if(ds.length < 3){ /* 選項不足就退化成拼字題 */ return qSpell(card, q); }
    opts = shuffle([{ text:s.zh, ok:true }, ...ds.map(t=>({ text:t, ok:false }))]);
  } else {
    const ds = distractors(w, quiz.pool, "term", s.pos, s.zh);
    if(ds.length < 3) return qSpell(card, q);
    opts = shuffle([{ text:w.term, ok:true }, ...ds.map(d=>({ text:d.term, ok:false }))]);
  }
  card.innerHTML = `
    <h3>${en2zh? "選出正確的中文" : "選出正確的英文"}</h3>
    <div class="qprompt${en2zh?"":" small"}">${en2zh ? esc(w.term)+" "+speakBtn(w.term) : senseHTML(s)}</div>
    <div class="opts">${opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(o.text)+'</button>').join("")}</div>
    <div class="fb" id="fb"></div>`;
  if(en2zh) autoSay(w.term);
  const btns = [...card.querySelectorAll(".opt")];
  btns.forEach((b,i)=>{
    b.onclick = ()=>{
      const ok = opts[i].ok;
      btns.forEach((x,j)=>{ x.disabled=true; if(opts[j].ok) x.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      card.querySelector("#fb").className = "fb "+(ok?"ok":"no");
      card.querySelector("#fb").textContent = ok? "答對了" : ("正確答案：" + w.term + "　" + sensesText(w));
      mark(w, ok);
      autoSay(w.term);
      waitNext(card);
    };
  });
}

/* --- 拼字填空 --- */
/* noHint = 中譯英模式：完全不給字母提示，從零默寫 */
function qSpell(card, q, listen, noHint){
  const w = q.word, s = q.sense || pickSense(w);
  const hint = (quizCfg.hint && !noHint)
    ? w.term.split("").map((c,i)=> (i===0 || !/[a-z]/i.test(c)) ? c : "_").join(" ")
    : "";
  card.innerHTML = `
    <h3>${listen? "聽發音，拼出單字" : noHint? "看中文，寫出完整的英文單字" : "依中文拼出英文單字"}</h3>
    <div class="qprompt small">${ listen ? '<button class="btn" data-speak="'+esc(w.term)+'">🔊 再播一次</button>'
        : senseHTML(s) }</div>
    ${hint?'<div class="hintword">'+esc(hint)+'</div>':''}
    <div class="spellwrap">
      <input type="password" id="ans" class="spellbox" name="vocab-answer" autocomplete="off" data-lpignore="true" data-1p-ignore data-bwignore autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="輸入英文">
      <div class="spellshow"><span></span><i class="caret"></i></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost" id="skip" style="flex:1">不會，看答案</button>
      <button class="btn primary" id="ok" style="flex:1">送出</button>
    </div>
    <div class="fb" id="fb"></div>`;
  const inp = card.querySelector("#ans");
  const shown = card.querySelector(".spellshow span");
  /* 游標固定在最後，避免在中間插字時畫面和實際內容對不上 */
  const sync = ()=>{ shown.textContent = inp.value; const n=inp.value.length; inp.setSelectionRange(n,n); };
  inp.oninput = sync;
  inp.onfocus = inp.onclick = inp.onkeyup = sync;
  setTimeout(()=>inp.focus(), 60);
  if(listen) Speech.say(w.term);

  const submit = (give)=>{
    if(quiz.answered) return;
    const ok = !give && Store.norm(inp.value) === Store.norm(w.term);
    quiz.answered = true;
    inp.disabled = true;
    const fb = card.querySelector("#fb");
    fb.className = "fb "+(ok?"ok":"no");
    fb.textContent = ok ? "答對了" : ("正確答案："+w.term+"　"+sensesText(w));
    mark(w, ok);
    autoSay(w.term);
    waitNext(card, ()=>{ quiz.answered=false; });
  };
  card.querySelector("#ok").onclick = ()=>submit(false);
  card.querySelector("#skip").onclick = ()=>submit(true);
  inp.onkeydown = e=>{ if(e.key==="Enter") submit(false); };
}

/* --- 聽力 --- */
function qListen(card, q){
  if(!Speech.available()){ return qChoice(card, q); }
  /* 一半聽力用拼字作答、一半用四選一 */
  if(Math.random()<0.5) return qSpell(card, q, true);
  const w = q.word;
  const ds = distractors(w, quiz.pool, "term");
  if(ds.length<3) return qSpell(card, q, true);
  const opts = shuffle([w, ...ds]);
  card.innerHTML = `
    <h3>聽發音，選出正確的單字</h3>
    <div class="qprompt"><button class="btn" data-speak="${esc(w.term)}">🔊 再播一次</button></div>
    <div class="opts">${opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(o.term)+'</button>').join("")}</div>
    <div class="fb" id="fb"></div>`;
  Speech.say(w.term);
  const btns = [...card.querySelectorAll(".opt")];
  btns.forEach((b,i)=>{
    b.onclick = ()=>{
      const ok = opts[i].id===w.id;
      btns.forEach((x,j)=>{ x.disabled=true; if(opts[j].id===w.id) x.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      const fb = card.querySelector("#fb");
      fb.className="fb "+(ok?"ok":"no");
      fb.textContent = ok? "答對了" : ("正確答案："+w.term+"　"+sensesText(w));
      mark(w, ok);
      waitNext(card);
    };
  });
}

/* --- 中英配對 --- */
function qMatch(card, q){
  const items = q.items;
  card.innerHTML = `
    <h3>把英文和中文配成對</h3>
    <div class="match">
      <div id="L" style="display:grid;gap:10px"></div>
      <div id="R" style="display:grid;gap:10px"></div>
    </div>
    <div class="fb" id="fb"></div>`;
  const L = card.querySelector("#L"), R = card.querySelector("#R");
  L.innerHTML = shuffle(items).map(w=>'<button class="opt" data-id="'+w.id+'">'+esc(w.term)+'</button>').join("");
  R.innerHTML = shuffle(items).map(w=>'<button class="opt" data-id="'+w.id+'">'+esc((q.senses?.[w.id] || pickSense(w)).zh)+'</button>').join("");
  let sel = null, left = items.length;
  const wrongOnce = new Set();

  const click = (side)=> e=>{
    const b = e.target.closest(".opt"); if(!b || b.classList.contains("done")) return;
    if(sel && sel.side===side){ sel.btn.classList.remove("sel"); }
    if(!sel || sel.side===side){ sel={side,btn:b,id:b.dataset.id}; b.classList.add("sel"); return; }
    /* 兩邊都選了 */
    const other = sel; sel=null; other.btn.classList.remove("sel");
    const w = items.find(x=>x.id===b.dataset.id);
    if(other.id === b.dataset.id){
      b.classList.add("done"); other.btn.classList.add("done");
      Store.grade(w, !wrongOnce.has(w.id));
      wrongOnce.has(w.id) ? quiz.wrong++ : quiz.right++;
      autoSay(w.term);
      if(--left === 0){ Store.save(); waitNext(card); }
    } else {
      b.classList.add("wrong"); other.btn.classList.add("wrong");
      const miss = items.find(x=>x.id===other.id) || w;
      if(!wrongOnce.has(miss.id)){
        wrongOnce.add(miss.id);
        if(!quiz.missed.some(m=>m.id===miss.id)) quiz.missed.push(miss);
      }
      setTimeout(()=>{ b.classList.remove("wrong"); other.btn.classList.remove("wrong"); }, 420);
    }
  };
  L.onclick = click("L");
  R.onclick = click("R");
}

/* --- 成績 --- */
function renderResult(root){
  const total = quiz.right + quiz.wrong;
  const pct = total ? Math.round(quiz.right/total*100) : 0;
  const missed = quiz.missed;
  root.innerHTML = "";
  root.appendChild(el(`<div class="card">
    <h1>測驗結果</h1>
    <div class="score" style="color:${pct>=80?'var(--ok)':pct>=60?'var(--warn)':'var(--bad)'}">${pct}%</div>
    <p class="hint" style="text-align:center">答對 ${quiz.right}・答錯 ${quiz.wrong}</p>
    ${ missed.length ? `<h3 style="margin-top:18px">錯題 (${missed.length})</h3>
      <ul class="wlist">${missed.map(w=>`<li><div class="wmain">
        <div class="wterm">${esc(w.term)}</div>
        <div class="wsub">${wordSenses(w).map(x=>'<span class="sense">'+senseHTML(x)+'</span>').join("")}</div></div>${speakBtn(w.term)}</li>`).join("")}</ul>
      <div class="row" style="margin-top:12px">
        <button class="btn sm" id="saveMissed">把錯題存成新的單字組</button>
        <button class="btn sm primary" id="drillMissed">只練錯題</button>
      </div>` : '<p class="hint" style="text-align:center">全部答對，太強了 🎉</p>' }
    <div class="row end" style="margin-top:18px">
      <button class="btn ghost" id="again">回設定</button>
      <button class="btn" id="redo">同樣的單字再練一次</button>
      <button class="btn primary" id="done">完成</button>
    </div>
  </div>`));
  const sm = root.querySelector("#saveMissed");
  if(sm) sm.onclick = ()=>{
    const g = Store.addGroup("錯題 "+new Date().toLocaleDateString("zh-TW"));
    Store.addToGroup(g.id, missed.map(w=>w.id));
    toast('已建立單字組「'+g.name+'」');
    sm.disabled = true;
  };
  const words = quiz.words, pool = quiz.pool, rounds = quiz.rounds;
  const restart = ws=>{ quiz = buildQuiz(pool, ws, rounds); UI.render(); };
  const dm = root.querySelector("#drillMissed");
  if(dm) dm.onclick = ()=>restart(missed.slice());
  root.querySelector("#redo").onclick = ()=>restart(words);
  root.querySelector("#again").onclick = ()=>{ quiz=null; UI.render(); };
  root.querySelector("#done").onclick  = ()=>{ quiz=null; UI.go("groups"); };
  quiz.qs = [];   /* 標記已結束 */
}

    if(!ws.length){ toast("這個範圍沒有單字"); return; }
    if(!confirm('把「'+nm+'」裡 '+ws.length+' 個單字的熟練度歸零？')) return;
    toast("已重置 "+Store.resetStats(ws.map(w=>w.id))+" 個單字"); UI.render();
  };
  root.querySelector("#exp").onclick = ()=>{
    download("vocab-backup-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(Store.data));
    toast("已匯出");
  };
  const file = root.querySelector("#impFile");
  root.querySelector("#impBtn").onclick = ()=>file.click();
  file.onchange = ()=>{
    const f = file.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const d = JSON.parse(rd.result);
        if(!d || typeof d!=="object" || !d.words) throw new Error("格式不符");
        const mode = confirm("按「確定」合併到現有資料，按「取消」則完全覆蓋。");
        if(mode){
          Object.values(d.words).forEach(w=>{ if(!Store.findByTerm(w.term)) Store.data.words[w.id||Store.uid()] = w; });
          (d.groups||[]).forEach(g=>{ if(!Store.data.groups.some(x=>x.name===g.name)) Store.data.groups.push(g); });
        } else {
          Store.data = Object.assign(Store.defaults(), d);
          Store.data.settings = Object.assign(Store.defaults().settings, Store.data.settings||{});
        }
        Store.migrate();
        Store.save(); toast("匯入完成"); UI.render();
      }catch(e){ toast("匯入失敗："+e.message); }
    };
    rd.readAsText(f);
  };
  root.querySelector("#wipe").onclick = ()=>{
    if(!confirm("確定清空所有單字、組別與紀錄？建議先匯出備份。")) return;
    if(!confirm("真的要清空嗎？此動作無法復原。")) return;
    Store.data = Store.defaults(); Store.save(); UI.render(); toast("已清空");
  };

  root.querySelector("#dedupe").onclick = ()=>{
    const items = findDupes();
    reviewModal("整理重複單字", "勾選的項目會被合併或改名。合併時中文取聯集，單字組和學習紀錄會一起搬過去。",
      items.map(it=> it.type==="merge"
        ? '「<b>'+esc(it.dup.term)+'</b>」合併到「'+esc(stripNum(it.keep.term))+'」'
        : '「<b>'+esc(it.keep.term)+'</b>」改名為「'+esc(it.to)+'」'),
      "合併", idx=>{
        const chosen = idx.map(i=>items[i]);
        chosen.filter(it=>it.type==="merge").forEach(it=>Store.mergeWords(it.keep.id, it.dup.id));
        chosen.filter(it=>it.type==="rename").forEach(it=>{ if(Store.data.words[it.keep.id]) it.keep.term = it.to; });
        Store.save(); UI.render(); toast("已整理 "+chosen.length+" 項");
      });
  };
  root.querySelector("#caseFix").onclick = ()=>{
    const ws = Object.values(Store.data.words).filter(w=>caseFix(w.term)!==w.term)
      .sort((a,b)=>a.term.localeCompare(b.term));
    reviewModal("統一改成小寫", "專有名詞（人名、地名、品牌）請取消勾選。",
      ws.map(w=>esc(w.term)+' → <b>'+esc(caseFix(w.term))+'</b>'),
      "改成小寫", idx=>{
        idx.forEach(i=>{ ws[i].term = caseFix(ws[i].term); });
        Store.save(); UI.render(); toast("已修改 "+idx.length+" 個單字");
      });
  };
  root.querySelector("#fill").onclick = e=>{
    if(fillJob){ fillJob.stop = true; e.target.textContent = "停止中…"; e.target.disabled = true; return; }
    const n = Object.values(Store.data.words).filter(w=>!w.phonetic || !w.example).length;
    if(!n){ toast("所有單字都已經有音標和例句了"); return; }
    if(!confirm("要查詢 "+n+" 個缺音標或例句的單字嗎？大約需要 "+Math.max(1,Math.ceil(n/60))+" 分鐘，可以隨時停止。")) return;
    fillDetails();
    UI.render();
  };

  const th = root.querySelector("#theme");
  th.value = s.theme||"auto";
  th.onchange = ()=>{ s.theme = th.value; Store.save(); applyTheme(); };
};

/* ---------------- 資料整理工具 ---------------- */
/* 同一個字（忽略大小寫、開頭編號、多餘空白）出現多次：留沒有編號、較早建立的那個 */
function findDupes(){
  const key = t=>Store.norm(stripNum(t)).replace(/\s+/g," ");
  const hasNum = w=>stripNum(w.term)!==w.term.trim();
  const byKey = {};
  Object.values(Store.data.words).forEach(w=>{ (byKey[key(w.term)] = byKey[key(w.term)] || []).push(w); });
  const items = [];
  Object.values(byKey).forEach(ws=>{
    ws.sort((a,b)=>(hasNum(a)-hasNum(b)) || (a.createdAt-b.createdAt));
    const keep = ws[0];
    ws.slice(1).forEach(d=>items.push({ type:"merge", keep, dup:d }));
    if(hasNum(keep)) items.push({ type:"rename", keep, to:stripNum(keep.term) });
  });
  return items;
}
/* 每個詞都改小寫，但保留全大寫的縮寫（CEO、TV）和單獨的「I」 */
function caseFix(t){
  return String(t).split(/(\s+)/).map(x=> (x==="I" || /^[A-Z0-9&.\-]{2,}$/.test(x)) ? x : x.toLowerCase()).join("");
}
function reviewModal(title, hint, labels, okText, apply){
  if(!labels.length){ toast("沒有需要整理的單字"); return; }
  const m = modal(`<h2>${esc(title)}</h2>
    <p class="hint">${hint}</p>
    <div class="row" style="margin-bottom:8px">
      <label class="chip"><input type="checkbox" id="rv_all" checked style="width:auto;min-height:0"> 全選</label>
      <span class="muted" style="font-size:13px;margin-left:auto" id="rv_n"></span>
    </div>
    <div class="picklist" id="rv_list">${labels.map((l,i)=>'<label><input type="checkbox" data-i="'+i+'" checked><span>'+l+'</span></label>').join("")}</div>
    <div class="row end" style="margin-top:12px">
      <button class="btn ghost" id="rv_cancel">取消</button>
      <button class="btn primary" id="rv_ok">${esc(okText)}</button>
    </div>`);
  const boxes = [...m.querySelectorAll("#rv_list input")];
  const cnt = ()=>{ m.querySelector("#rv_n").textContent = "已選 "+boxes.filter(b=>b.checked).length+" / "+boxes.length; };
  cnt();
  m.querySelector("#rv_list").onchange = cnt;
  m.querySelector("#rv_all").onchange = e=>{ boxes.forEach(b=>b.checked = e.target.checked); cnt(); };
  m.querySelector("#rv_cancel").onclick = ()=>m.close();
  m.querySelector("#rv_ok").onclick = ()=>{
    const idx = boxes.filter(b=>b.checked).map(b=>+b.dataset.i);
    if(!idx.length){ toast("沒有勾選任何項目"); return; }
    m.close(); apply(idx);
  };
}
/* 批次補音標／例句：在背景跑，切換分頁也不會中斷 */
let fillJob = null;
function fillStatus(){
  if(fillJob) return "查詢中 "+fillJob.done+" / "+fillJob.total+"・已補 "+fillJob.got+" 個";
  const ws = Object.values(Store.data.words);
  return "缺音標 "+ws.filter(w=>!w.phonetic).length+" 個・缺例句 "+ws.filter(w=>!w.example).length+" 個";
}
async function fillDetails(){
  const todo = Object.values(Store.data.words).filter(w=>!w.phonetic || !w.example);
  const job = fillJob = { total:todo.length, done:0, got:0, stop:false };
  const tick = ()=>{ const m = document.getElementById("fillMsg"); if(m) m.textContent = fillStatus(); };
  Lookup.dictDown = 0;
  let i = 0;
  const worker = async ()=>{
    while(i < todo.length && !job.stop){
      const w = todo[i++];
      try{
        const o = await Lookup.dict(w.term);
        let hit = false;
        if(!w.phonetic && o.phonetic){ w.phonetic = o.phonetic; hit = true; }
        if(!w.example && o.example){ w.example = o.example; hit = true; }
        if(hit) job.got++;
      }catch(e){ /* 查不到就跳過 */ }
      job.done++;
      if(job.done % 10 === 0) Store.save();
      tick();
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  Store.save();
  fillJob = null;
  toast((job.stop ? "已停止，" : "查詢完成，") + "補了 "+job.got+" 個單字");
  if(UI.route==="settings") UI.render(); else tick();
}

/* =====================================================================
   啟動
   ===================================================================== */
function applyTheme(){
  const t = Store.data.settings.theme || "auto";
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

Store.load();
Speech.init();
applyTheme();
if(Object.keys(Store.data.words).length) UI.route = "words";
UI.render();

document.getElementById("tabbar").addEventListener("click", e=>{
  const b = e.target.closest("[data-tab]"); if(!b) return;
  Speech.warm();
  if(b.dataset.tab!=="quiz") quiz = null;
  UI.go(b.dataset.tab);
});
document.getElementById("focusSel").addEventListener("change", e=>{
  Store.data.focusGroup = e.target.value; Store.save();
  study = null; quiz = null; selected.clear();
  readOrder = null; revealed.clear();
  UI.render();
});
document.getElementById("soundBtn").addEventListener("click", ()=>{
  const s = Store.data.settings;
  s.autoSpeak = !s.autoSpeak;
  Store.save(); UI.render();
  toast(s.autoSpeak ? "自動發音：開" : "自動發音：關");
  if(s.autoSpeak) Speech.say("ok");
});
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const order = ["auto","light","dark"];
  const s = Store.data.settings;
  s.theme = order[(order.indexOf(s.theme||"auto")+1) % 3];
  Store.save(); applyTheme();
  toast("主題："+({auto:"跟隨系統",light:"淺色",dark:"深色"})[s.theme]);
});
/* 全域發音按鈕 */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-speak]");
  if(b){ e.stopPropagation(); Speech.say(b.dataset.speak); }
});
/* 鍵盤快捷（背誦） */
document.addEventListener("keydown", e=>{
  if(UI.route!=="study" || !study) return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if(e.code==="Space"){ e.preventDefault(); document.getElementById("fc")?.click(); }
  else if(e.key==="ArrowRight") document.getElementById("yes")?.click();
  else if(e.key==="ArrowLeft")  document.getElementById("no")?.click();
});
